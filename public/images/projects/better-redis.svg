<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
  <title id="title">Better Redis sharded storage architecture</title>
  <desc id="desc">Requests are hashed and routed to independent shard workers. Each shard owns hash-ring segments and can split a full segment locally.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#171b2b"/>
      <stop offset="1" stop-color="#0e1220"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" x2="1">
      <stop offset="0" stop-color="#d6b7ff"/>
      <stop offset="1" stop-color="#9c8cff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1">
      <stop offset="0" stop-color="#9baeff"/>
      <stop offset="1" stop-color="#64d4ff"/>
    </linearGradient>
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#9baeff"/>
    </marker>
  </defs>
  <rect width="1600" height="700" fill="url(#bg)"/>
  <g opacity="0.18" stroke="#9ca8cf" stroke-width="1">
    <path d="M40 80H1560M40 160H1560M40 240H1560M40 320H1560M40 400H1560M40 480H1560M40 560H1560M40 640H1560"/>
    <path d="M80 40V660M160 40V660M240 40V660M320 40V660M400 40V660M480 40V660M560 40V660M640 40V660M720 40V660M800 40V660M880 40V660M960 40V660M1040 40V660M1120 40V660M1200 40V660M1280 40V660M1360 40V660M1440 40V660M1520 40V660"/>
  </g>
  <g font-family="Inter,Arial,sans-serif">
    <text x="56" y="54" fill="#f1efff" font-size="27" font-weight="700">BETTER REDIS</text>
    <text x="56" y="82" fill="#aeb5d2" font-size="14" letter-spacing="2">SHARDED IN-MEMORY KEY-VALUE STORAGE</text>
  </g>
  <g font-family="Inter,Arial,sans-serif" text-anchor="middle">
    <rect x="56" y="142" width="190" height="150" rx="18" fill="#242a44" stroke="#d6b7ff" stroke-width="2"/>
    <text x="151" y="178" fill="#f1efff" font-size="19" font-weight="700">CLIENT OPS</text>
    <rect x="82" y="198" width="138" height="28" rx="7" fill="#d6b7ff" fill-opacity="0.16" stroke="#d6b7ff"/>
    <rect x="82" y="234" width="138" height="28" rx="7" fill="#9baeff" fill-opacity="0.16" stroke="#9baeff"/>
    <text x="151" y="218" fill="#f1efff" font-size="14">SET name anurag</text>
    <text x="151" y="254" fill="#f1efff" font-size="14">GET name</text>
    <path d="M246 217H320" stroke="#9baeff" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="320" y="142" width="190" height="150" rx="18" fill="#242a44" stroke="#9baeff" stroke-width="2"/>
    <text x="415" y="178" fill="#f1efff" font-size="19" font-weight="700">HASH KEY</text>
    <circle cx="415" cy="224" r="29" fill="none" stroke="url(#blue)" stroke-width="4"/>
    <path d="M415 195V253M386 224H444" stroke="#9baeff" stroke-width="2"/>
    <text x="415" y="274" fill="#aeb5d2" font-size="13">route by hash</text>
    <path d="M510 217H576" stroke="#9baeff" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
  <g font-family="Inter,Arial,sans-serif">
    <text x="592" y="126" fill="#f1efff" font-size="16" font-weight="700">INDEPENDENT SHARD WORKERS</text>
    <g transform="translate(576 142)">
      <rect width="250" height="150" rx="18" fill="#202640" stroke="#8f83e8" stroke-width="2"/>
      <text x="24" y="34" fill="#d6b7ff" font-size="16" font-weight="700">SHARD 01</text>
      <text x="24" y="57" fill="#aeb5d2" font-size="13">worker + queue</text>
      <rect x="24" y="78" width="58" height="45" rx="8" fill="#d6b7ff" fill-opacity="0.18" stroke="#d6b7ff"/>
      <rect x="94" y="78" width="58" height="45" rx="8" fill="#d6b7ff" fill-opacity="0.18" stroke="#d6b7ff"/>
      <rect x="164" y="78" width="58" height="45" rx="8" fill="#333b60" stroke="#aeb5d2"/>
      <text x="53" y="105" fill="#f1efff" font-size="12" text-anchor="middle">A</text><text x="123" y="105" fill="#f1efff" font-size="12" text-anchor="middle">B</text><text x="193" y="105" fill="#aeb5d2" font-size="12" text-anchor="middle">C</text>
    </g>
    <g transform="translate(846 142)">
      <rect width="250" height="150" rx="18" fill="#202640" stroke="#8ca4ff" stroke-width="2"/>
      <text x="24" y="34" fill="#9baeff" font-size="16" font-weight="700">SHARD 02</text>
      <text x="24" y="57" fill="#aeb5d2" font-size="13">worker + queue</text>
      <rect x="24" y="78" width="58" height="45" rx="8" fill="#9baeff" fill-opacity="0.18" stroke="#9baeff"/>
      <rect x="94" y="78" width="58" height="45" rx="8" fill="#9baeff" fill-opacity="0.18" stroke="#9baeff"/>
      <rect x="164" y="78" width="58" height="45" rx="8" fill="#333b60" stroke="#aeb5d2"/>
      <text x="53" y="105" fill="#f1efff" font-size="12" text-anchor="middle">A</text><text x="123" y="105" fill="#f1efff" font-size="12" text-anchor="middle">B</text><text x="193" y="105" fill="#aeb5d2" font-size="12" text-anchor="middle">C</text>
    </g>
    <g transform="translate(1116 142)">
      <rect width="250" height="150" rx="18" fill="#202640" stroke="#64d4ff" stroke-width="2"/>
      <text x="24" y="34" fill="#64d4ff" font-size="16" font-weight="700">SHARD 03</text>
      <text x="24" y="57" fill="#aeb5d2" font-size="13">worker + queue</text>
      <rect x="24" y="78" width="58" height="45" rx="8" fill="#64d4ff" fill-opacity="0.18" stroke="#64d4ff"/>
      <rect x="94" y="78" width="58" height="45" rx="8" fill="#64d4ff" fill-opacity="0.18" stroke="#64d4ff"/>
      <rect x="164" y="78" width="58" height="45" rx="8" fill="#333b60" stroke="#aeb5d2"/>
      <text x="53" y="105" fill="#f1efff" font-size="12" text-anchor="middle">A</text><text x="123" y="105" fill="#f1efff" font-size="12" text-anchor="middle">B</text><text x="193" y="105" fill="#aeb5d2" font-size="12" text-anchor="middle">C</text>
    </g>
  </g>
  <path d="M701 292V348M971 292V348M1241 292V348" stroke="#68759e" stroke-width="2" stroke-dasharray="6 8"/>
  <g font-family="Inter,Arial,sans-serif">
    <rect x="56" y="348" width="1310" height="260" rx="22" fill="#151a2c" stroke="#333b60" stroke-width="2"/>
    <text x="88" y="389" fill="#f1efff" font-size="19" font-weight="700">SEGMENTED HASH TABLE</text>
    <text x="88" y="416" fill="#aeb5d2" font-size="14">Each shard owns a ring of segments. Full regions split locally instead of resizing the whole table.</text>
    <circle cx="310" cy="506" r="83" fill="none" stroke="#4b587f" stroke-width="2"/>
    <circle cx="310" cy="506" r="65" fill="none" stroke="url(#blue)" stroke-width="8" stroke-dasharray="2 14"/>
    <path d="M310 441A65 65 0 0 1 366 538L310 506Z" fill="#9baeff" fill-opacity="0.2" stroke="#9baeff"/>
    <path d="M366 538A65 65 0 0 1 254 538L310 506Z" fill="#d6b7ff" fill-opacity="0.2" stroke="#d6b7ff"/>
    <path d="M254 538A65 65 0 0 1 310 441L310 506Z" fill="#64d4ff" fill-opacity="0.18" stroke="#64d4ff"/>
    <circle cx="310" cy="506" r="5" fill="#f1efff"/>
    <text x="310" y="625" fill="#aeb5d2" font-size="13" text-anchor="middle">hash ring → segment → bucket → slot</text>
    <g transform="translate(520 454)">
      <text x="0" y="0" fill="#aeb5d2" font-size="13">FULL SEGMENT A</text>
      <rect x="0" y="20" width="150" height="62" rx="10" fill="#ffb7cf" fill-opacity="0.14" stroke="#ffb7cf"/>
      <text x="75" y="57" fill="#f1efff" font-size="15" text-anchor="middle">split locally</text>
      <path d="M166 51H214" stroke="#ffb7cf" stroke-width="3" marker-end="url(#arrow)"/>
    </g>
    <g transform="translate(760 442)">
      <text x="0" y="0" fill="#aeb5d2" font-size="13">AFTER SPLIT</text>
      <rect x="0" y="20" width="120" height="82" rx="10" fill="#d6b7ff" fill-opacity="0.16" stroke="#d6b7ff"/>
      <rect x="138" y="20" width="120" height="82" rx="10" fill="#9baeff" fill-opacity="0.16" stroke="#9baeff"/>
      <text x="60" y="67" fill="#f1efff" font-size="15" text-anchor="middle">B</text>
      <text x="198" y="67" fill="#f1efff" font-size="15" text-anchor="middle">A</text>
      <text x="129" y="126" fill="#aeb5d2" font-size="13" text-anchor="middle">only affected keys rehashed</text>
    </g>
    <g transform="translate(1080 444)">
      <text x="0" y="0" fill="#aeb5d2" font-size="13">BUCKET SLOTS</text>
      <rect x="0" y="22" width="52" height="38" rx="7" fill="#9baeff" fill-opacity="0.2" stroke="#9baeff"/>
      <rect x="62" y="22" width="52" height="38" rx="7" fill="#d6b7ff" fill-opacity="0.2" stroke="#d6b7ff"/>
      <rect x="124" y="22" width="52" height="38" rx="7" fill="#333b60" stroke="#aeb5d2"/>
      <text x="88" y="94" fill="#aeb5d2" font-size="13" text-anchor="middle">fixed capacity</text>
    </g>
  </g>
</svg>
